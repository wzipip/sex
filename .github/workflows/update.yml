name: Auto Update Video Data

on:
  schedule:
    # 每天中午 12:00（北京时间）自动触发，即 UTC 时间 04:00
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run collector script
        run: python update_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # 修正这里：只 add 实际存在的 data/ 目录
          git add data/
          git diff --quiet && git diff --cached --quiet || (git commit -m "Automated update (Daily Top 10 Pages): $(date -u +'%Y-%m-%d %H:%M:%S')" && git push)
