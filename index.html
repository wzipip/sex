<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault - Video Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #121212; color: #e0e0e0; font-family: Arial, sans-serif; }
        header { background: #1f1f1f; padding: 10px 15px; text-align: center; border-bottom: 1px solid #333; }
        header h1 { color: #ff4757; font-size: 18px; letter-spacing: 1px; }
        .container { max-width: 1200px; margin: 8px auto; padding: 0 6px; }
        
        /* 🎯 三行紧凑网格导航：11列布局（总计33个格子，完美铺满3行） */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            gap: 3px;
            background: #181818;
            padding: 5px;
            border: 1px solid #2c2c2c;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        .nav-item {
            background: #222;
            padding: 5px 2px;
            text-align: center;
            color: #ccc;
            text-decoration: none;
            font-size: 10px;
            line-height: 1.1;
            border-radius: 2px;
            transition: all 0.15s ease;
            border: 1px solid #2a2a2a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .nav-item:hover, .nav-item.active {
            background: #ff4757;
            color: #fff;
            border-color: #ff6b81;
        }

        .section-title {
            margin-bottom: 8px;
            font-size: 14px;
            border-left: 3px solid #ff4757;
            padding-left: 6px;
            color: #fff;
        }
        
        /* 视频列表网格 */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 8px;
        }
        .video-card {
            background: #1e1e1e;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #2d2d2d;
            transition: transform 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .video-card:hover {
            transform: translateY(-2px);
            border-color: #555;
        }
        .video-thumb {
            width: 100%;
            height: 100px;
            background: #2a2a2a;
            object-fit: cover;
        }
        .video-info {
            padding: 6px;
        }
        .video-title {
            font-size: 11px;
            color: #fff;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .video-meta {
            font-size: 10px;
            color: #888;
            display: flex;
            justify-content: space-between;
        }

        /* 电脑端宽屏适配 */
        @media (min-width: 768px) {
            .container { margin: 12px auto; padding: 0 12px; }
            .nav-grid {
                padding: 8px;
                gap: 5px;
                margin-bottom: 16px;
            }
            .nav-item {
                font-size: 11px;
                padding: 6px 4px;
            }
            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 12px;
            }
            .video-thumb {
                height: 130px;
            }
            .video-title {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>STREAMVAULT</h1>
    </header>

    <div class="container">
        <!-- 🎯 11列布局，刚好铺满3行（1个Latest + 32个分类 = 33项） -->
        <nav class="nav-grid" id="navGrid"></nav>

        <!-- 视频列表区块 -->
        <section>
            <div class="section-title" id="sectionTitle">🔥 Latest Releases</div>
            <div class="video-grid" id="videoGrid"></div>
        </section>
    </div>

    <script>
        const categories = [
            "Featured", "Cam Girls", "JP Censored", "JP Uncensored",
            "CN Subtitles", "Busty Petite", "Sexy Wives", "Taboo / Incest",
            "Western", "Cat III", "Anime", "Stockings OL",
            "Amateur", "JP Studios", "Plot", "Leaked",
            "LGBT", "Escort", "CN Wives", "CN BDSM",
            "CN Stockings", "Madou", "CN Taboo", "Deepfake",
            "Dominance", "Humiliation", "Orgy", "Roleplay",
            "HK & TW", "Hardcore", "Trans / Femboy", "VR"
        ];

        function renderNav() {
            const navGrid = document.getElementById('navGrid');
            let html = `<a href="#" class="nav-item active" onclick="loadVideos('cat_latest.json', '🔥 Latest Releases', this)">🔥 Latest</a>`;
            html += categories.map(cat => 
                `<a href="#" class="nav-item" onclick="filterCategory('${cat}', this)" title="${cat}">${cat}</a>`
            ).join('');
            navGrid.innerHTML = html;
        }

        async function loadVideos(jsonFile, title, element) {
            if (element) {
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                element.classList.add('active');
            }
            document.getElementById('sectionTitle').innerText = title;
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '<div style="color:#888; grid-column: 1/-1; text-align:center; padding: 20px;">Loading...</div>';

            try {
                const res = await fetch(`data/${jsonFile}`);
                const videos = await res.json();
                
                if (videos.length === 0) {
                    grid.innerHTML = '<div style="color:#888; grid-column: 1/-1; text-align:center; padding: 20px;">No videos found.</div>';
                    return;
                }

                grid.innerHTML = videos.map(v => `
                    <a href="play.html?id=${v.id}" class="video-card">
                        <img src="${v.pic || 'https://via.placeholder.com/300x180?text=No+Image'}" class="video-thumb" alt="thumbnail" loading="lazy">
                        <div class="video-info">
                            <div class="video-title">${v.title}</div>
                            <div class="video-meta">
                                <span>${v.year || '2026'}</span>
                                <span>HD</span>
                            </div>
                        </div>
                    </a>
                `).join('');
            } catch (e) {
                console.error("Failed to load videos:", e);
                grid.innerHTML = '<div style="color:#888; grid-column: 1/-1; text-align:center; padding: 20px;">Please ensure data files are generated.</div>';
            }
        }

        async function filterCategory(catName, element) {
            event.preventDefault();
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');
            
            document.getElementById('sectionTitle').innerText = catName;
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '<div style="color:#888; grid-column: 1/-1; text-align:center; padding: 20px;">Loading category...</div>';

            try {
                const res = await fetch('data/categories.json');
                const catIndex = await res.json();
                const matched = catIndex.find(c => c.name === catName);

                if (!matched) {
                    grid.innerHTML = '<div style="color:#888; grid-column: 1/-1; text-align:center; padding: 20px;">Category data not found.</div>';
                    return;
                }

                let allVideos = [];
                if (matched.file) {
                    const r = await fetch(`data/${matched.file}`);
                    allVideos = await r.json();
                } else if (matched.files) {
                    for (let fname of matched.files) {
                        const r = await fetch(`data/${fname}`);
                        const chunk = await r.json();
                        allVideos = allVideos.concat(chunk);
                    }
                }

                grid.innerHTML = allVideos.map(v => `
                    <a href="play.html?id=${v.id}" class="video-card">
                        <img src="${v.pic || 'https://via.placeholder.com/300x180?text=No+Image'}" class="video-thumb" alt="thumbnail" loading="lazy">
                        <div class="video-info">
                            <div class="video-title">${v.title}</div>
                            <div class="video-meta">
                                <span>${v.year || '2026'}</span>
                                <span>HD</span>
                            </div>
                        </div>
                    </a>
                `).join('');
            } catch (e) {
                console.error("Error loading category:", e);
                grid.innerHTML = '<div style="color:#888; grid-column: 1/-1; text-align:center; padding: 20px;">Failed to load category content.</div>';
            }
        }

        renderNav();
        loadVideos('cat_latest.json', '🔥 Latest Releases');
    </script>
</body>
</html>
