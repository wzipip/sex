<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault - 精选影视中心</title>
    <style>
        :root {
            --bg-main: #0f1014;
            --bg-card: #181a20;
            --bg-nav: #14151a;
            --accent: #ff3b5c;
            --text-primary: #f5f5f7;
            --text-muted: #8e929f;
            --border-color: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* 让整个页面采用 Flex 粘性底部布局 */
        html, body { height: 100%; }
        body { 
            background-color: var(--bg-main); 
            color: var(--text-primary); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        .page-wrapper {
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }
        .container { 
            flex: 1; /* 撑开主体，把页脚顶到底部 */
            max-width: 1240px; 
            margin: 12px auto; 
            padding: 0 10px; 
            width: 100%;
        }

        /* 现代吸顶头部 */
        .site-header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(20, 21, 26, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 16px;
        }
        .header-inner {
            max-width: 1240px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
        }
        .brand {
            display: flex; align-items: center; gap: 8px;
            text-decoration: none; color: #fff; font-size: 18px; font-weight: 800; letter-spacing: 0.5px;
        }
        .brand-dot {
            width: 9px; height: 9px; border-radius: 50%;
            background: var(--accent); box-shadow: 0 0 8px var(--accent);
        }
        .search-box {
            display: flex; align-items: center; background: #22252e;
            border: 1px solid var(--border-color); border-radius: 18px;
            padding: 4px 12px; width: 180px; transition: width 0.25s, border-color 0.2s;
        }
        .search-box:focus-within { width: 250px; border-color: var(--accent); }
        .search-box input {
            background: transparent; border: none; outline: none;
            color: #fff; font-size: 12px; width: 100%;
        }

        /* 分类导航：紧凑、无空白、完全对齐 */
        .nav-panel {
            background: var(--bg-nav); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 8px; margin-bottom: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
            gap: 4px;
            align-content: start;
        }
        .nav-item {
            display: flex; align-items: center; justify-content: center;
            background: #1e2028; color: #c8ccd6;
            text-decoration: none; font-size: 11px; font-weight: 500;
            padding: 6px 4px; border-radius: 4px;
            border: 1px solid transparent;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: all 0.15s ease;
        }
        .nav-item:hover {
            background: #282b36; color: #fff; border-color: rgba(255,255,255,0.12);
        }
        .nav-item.active {
            background: linear-gradient(135deg, #ff3b5c, #e02444);
            color: #fff; font-weight: 600;
            box-shadow: 0 2px 8px rgba(255, 59, 92, 0.3);
        }

        /* 栏目标题 */
        .section-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border-color);
        }
        .section-title {
            font-size: 15px; font-weight: 700; color: #fff;
            display: flex; align-items: center; gap: 8px;
        }
        .section-title::before {
            content: ""; display: inline-block; width: 3px; height: 14px;
            background: var(--accent); border-radius: 2px;
        }
        .count-badge { font-size: 12px; color: var(--text-muted); }

        /* 视频网格 */
        .video-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(152px, 1fr)); gap: 8px;
        }
        .video-card {
            background: var(--bg-card); border-radius: 6px; overflow: hidden;
            border: 1px solid var(--border-color); text-decoration: none; color: inherit;
            display: flex; flex-direction: column; transition: transform 0.18s, border-color 0.18s;
        }
        .video-card:hover { transform: translateY(-2px); border-color: rgba(255, 59, 92, 0.5); }
        .thumb-wrap { position: relative; width: 100%; padding-top: 62%; background: #22252e; overflow: hidden; }
        .video-thumb { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .badge-hd {
            position: absolute; top: 5px; right: 5px;
            background: rgba(0, 0, 0, 0.75); color: #fff;
            font-size: 9px; font-weight: 700; padding: 2px 4px; border-radius: 3px;
        }
        .video-info { padding: 7px 8px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .video-title {
            font-size: 12px; font-weight: 500; color: #eee; margin-bottom: 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .video-meta { font-size: 10px; color: var(--text-muted); display: flex; justify-content: space-between; }

        /* 分页栏 */
        .pagination {
            display: flex; justify-content: center; align-items: center; gap: 10px; margin: 22px 0 30px;
        }
        .page-btn {
            background: #1e2028; color: #e0e0e0; border: 1px solid var(--border-color);
            padding: 6px 14px; font-size: 12px; font-weight: 600; border-radius: 5px;
            cursor: pointer; transition: 0.15s;
        }
        .page-btn:hover:not(:disabled) { background: var(--accent); color: #fff; border-color: var(--accent); }
        .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .page-info { font-size: 12px; color: var(--text-muted); }

        /* 现代风格页脚 */
        .site-footer {
            background: var(--bg-nav);
            border-top: 1px solid var(--border-color);
            padding: 24px 16px;
            margin-top: 40px;
            text-align: center;
            color: var(--text-muted);
            font-size: 11px;
        }
        .footer-content {
            max-width: 1240px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }
        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.15s;
        }
        .footer-links a:hover {
            color: var(--accent);
        }

        @media (min-width: 768px) {
            .nav-grid { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
            .nav-item { font-size: 12px; padding: 7px 6px; }
            .video-grid { grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 12px; }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <header class="site-header">
            <div class="header-inner">
                <a href="index.html" class="brand">
                    <span class="brand-dot"></span>
                    <span>STREAMVAULT</span>
                </a>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="全站搜索影片..." oninput="handleSearch()">
                </div>
            </div>
        </header>

        <div class="container">
            <!-- 紧凑整齐的导航 -->
            <div class="nav-panel">
                <nav class="nav-grid" id="navGrid"></nav>
            </div>

            <section>
                <div class="section-header">
                    <div class="section-title" id="sectionTitle">🔥 最新发布</div>
                    <div class="count-badge" id="totalBadge"></div>
                </div>
                
                <div class="video-grid" id="videoGrid"></div>
                
                <div class="pagination" id="paginationBar" style="display: none;">
                    <button class="page-btn" id="prevBtn" onclick="changePage(-1)">上一页</button>
                    <span class="page-info" id="pageInfo">第 1 / 1 页</span>
                    <button class="page-btn" id="nextBtn" onclick="changePage(1)">下一页</button>
                </div>
            </section>
        </div>

        <!-- 底部页脚 -->
        <footer class="site-footer">
            <div class="footer-content">
                <p>&copy; 2026 <strong>StreamVault</strong>. All rights reserved.</p>
                <p class="footer-links">
                    <span>高速影视聚合引擎</span> &bull; 
                    <a href="index.html">返回首页</a>
                </p>
            </div>
        </footer>
    </div>

    <script>
        let categoriesList = [];
        let currentCategoryMeta = null; 
        let currentPage = 1;
        const pageSize = 24; 
        let pageCache = {};  
        
        let globalSearchIndex = null; 
        let searchKeyword = '';

        async function initSite() {
            const navGrid = document.getElementById('navGrid');
            const urlParams = new URLSearchParams(window.location.search);
            const targetCat = urlParams.get('cat');
            const targetPage = parseInt(urlParams.get('page')) || 1;
            const targetQuery = urlParams.get('q');

            try {
                const res = await fetch('data/categories.json');
                const catIndex = await res.json();
                categoriesList = catIndex;

                const validCats = catIndex.filter(c => 
                    c.name !== '🔥 Latest Releases' && 
                    c.name !== 'Uncategorized' && 
                    Number(c.count) > 0
                );

                let latestMeta = catIndex.find(c => c.name === '🔥 Latest Releases') || { name: '🔥 Latest Releases', count: 120, files: [] };

                let html = `<a href="index.html" class="nav-item ${!targetCat && !targetQuery ? 'active' : ''}" onclick="switchCategory('🔥 Latest Releases', 1, this); return false;">🔥 最新发布</a>`;
                
                html += validCats.map(c => {
                    const isActive = targetCat === c.name ? 'active' : '';
                    return `<a href="index.html?cat=${encodeURIComponent(c.name)}" class="nav-item ${isActive}" data-cat="${c.name}" onclick="switchCategory('${c.name}', 1, this); return false;" title="${c.name} (${c.count})">${c.name}</a>`;
                }).join('');

                navGrid.innerHTML = html;

                if (targetQuery) {
                    document.getElementById('searchInput').value = targetQuery;
                    searchKeyword = targetQuery.trim().toLowerCase();
                    document.getElementById('sectionTitle').innerText = `🔍 全站搜索: "${targetQuery}"`;
                    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                    currentPage = targetPage;
                    await loadGlobalSearchResults();
                    return;
                }

                let activeMeta = latestMeta;
                if (targetCat) {
                    const matched = catIndex.find(c => c.name === targetCat);
                    if (matched) activeMeta = matched;
                }

                currentPage = targetPage;
                currentCategoryMeta = activeMeta;

                const activeEl = targetCat ? document.querySelector(`[data-cat="${targetCat}"]`) : navGrid.querySelector('a');
                if (activeEl) {
                    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                    activeEl.classList.add('active');
                }

                document.getElementById('sectionTitle').innerText = activeMeta.name.replace('🔥 Latest Releases', '🔥 最新发布');
                await loadPageData();
            } catch (e) {
                console.error("初始化导航失败", e);
                navGrid.innerHTML = '<div style="color:#888;font-size:12px;padding:6px;">暂无分类数据，请运行采集脚本。</div>';
            }
        }

        async function switchCategory(catName, pageNum, element) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');

            const matchedMeta = categoriesList.find(c => c.name === catName) || categoriesList[0];
            currentCategoryMeta = matchedMeta;
            currentPage = pageNum || 1;
            searchKeyword = '';
            document.getElementById('searchInput').value = '';
            document.getElementById('sectionTitle').innerText = matchedMeta.name.replace('🔥 Latest Releases', '🔥 最新发布');

            updateUrlState();
            await loadPageData();
        }

        function updateUrlState() {
            let newUrl = 'index.html';
            const params = [];

            if (searchKeyword) {
                params.push(`q=${encodeURIComponent(searchKeyword)}`);
            } else if (currentCategoryMeta && currentCategoryMeta.name !== '🔥 Latest Releases') {
                params.push(`cat=${encodeURIComponent(currentCategoryMeta.name)}`);
            }
            if (currentPage > 1) {
                params.push(`page=${currentPage}`);
            }
            if (params.length > 0) {
                newUrl += '?' + params.join('&');
            }
            window.history.pushState({}, '', newUrl);
        }

        async function loadGlobalSearchResults() {
            const grid = document.getElementById('videoGrid');
            const paginationBar = document.getElementById('paginationBar');
            grid.innerHTML = '<div style="color:#888; grid-column: 1/-1; text-align:center; padding: 35px;">正在全局搜索...</div>';
            paginationBar.style.display = 'none';

            try {
                if (!globalSearchIndex) {
                    const res = await fetch('data/search_index.json');
                    globalSearchIndex = await res.json();
                }

                const matchedList = globalSearchIndex.filter(v => v.title.toLowerCase().includes(searchKeyword));
                const totalPages = Math.ceil(matchedList.length / pageSize) || 1;
                
                if (currentPage > totalPages) currentPage = totalPages;
                if (currentPage < 1) currentPage = 1;

                const start = (currentPage - 1) * pageSize;
                const pageItems = matchedList.slice(start, start + pageSize);

                document.getElementById('totalBadge').innerText = `全站找到 ${matchedList.length} 部相关影片`;
                renderGrid(pageItems, totalPages);
            } catch (e) {
                console.error("全局搜索失败", e);
                grid.innerHTML = '<div style="color:#888; grid-column: 1/-1; text-align:center; padding: 35px;">搜索索引加载失败，请确认已运行最新采集脚本。</div>';
            }
        }

        async function loadPageData() {
            if (searchKeyword) {
                await loadGlobalSearchResults();
                return;
            }

            const grid = document.getElementById('videoGrid');
            const paginationBar = document.getElementById('paginationBar');
            grid.innerHTML = '<div style="color:#888; grid-column: 1/-1; text-align:center; padding: 35px;">正在加载...</div>';
            paginationBar.style.display = 'none';

            try {
                const totalCount = currentCategoryMeta.count || 0;
                document.getElementById('totalBadge').innerText = `共 ${totalCount} 部`;

                if (totalCount === 0) {
                    grid.innerHTML = '<div style="color:#888; grid-column: 1/-1; text-align:center; padding: 35px;">该分类暂无影片</div>';
                    return;
                }

                let files = currentCategoryMeta.files || (currentCategoryMeta.file ? [currentCategoryMeta.file] : []);
                if (files.length === 0) {
                    grid.innerHTML = '<div style="color:#888; grid-column: 1/-1; text-align:center; padding: 35px;">暂无数据源文件</div>';
                    return;
                }

                const totalPages = Math.ceil(totalCount / pageSize);
                if (currentPage > totalPages) currentPage = totalPages;
                if (currentPage < 1) currentPage = 1;

                const targetFile = files[currentPage - 1] || files[files.length - 1];
                const cacheKey = `${currentCategoryMeta.name}_p${currentPage}`;

                let pageItems = [];
                if (pageCache[cacheKey]) {
                    pageItems = pageCache[cacheKey];
                } else {
                    const res = await fetch(`data/${targetFile}`);
                    pageItems = await res.json();
                    pageCache[cacheKey] = pageItems;
                }

                renderGrid(pageItems, totalPages);
            } catch (e) {
                console.error("加载数据失败", e);
                grid.innerHTML = '<div style="color:#888; grid-column: 1/-1; text-align:center; padding: 35px;">数据加载失败</div>';
            }
        }

        function renderGrid(items, totalPages) {
            const grid = document.getElementById('videoGrid');
            const paginationBar = document.getElementById('paginationBar');

            if (items.length === 0) {
                grid.innerHTML = '<div style="color:#888; grid-column: 1/-1; text-align:center; padding: 35px;">没有找到相关影片</div>';
                paginationBar.style.display = 'none';
                return;
            }

            grid.innerHTML = items.map(v => `
                <a href="play.html?id=${v.id}" class="video-card">
                    <div class="thumb-wrap">
                        <img src="${v.pic || 'https://via.placeholder.com/300x180?text=No+Image'}" class="video-thumb" alt="${v.title}" loading="lazy">
                        <span class="badge-hd">HD</span>
                    </div>
                    <div class="video-info">
                        <div class="video-title" title="${v.title}">${v.title}</div>
                        <div class="video-meta">
                            <span>${v.category || '精选'}</span>
                            <span>${v.year || '2026'}</span>
                        </div>
                    </div>
                </a>
            `).join('');

            if (totalPages > 1) {
                paginationBar.style.display = 'flex';
                document.getElementById('pageInfo').innerText = `第 ${currentPage} / ${totalPages} 页`;
                document.getElementById('prevBtn').disabled = (currentPage === 1);
                document.getElementById('nextBtn').disabled = (currentPage === totalPages);
            } else {
                paginationBar.style.display = 'none';
            }

            updateUrlState();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function changePage(step) {
            currentPage += step;
            if (searchKeyword) {
                loadGlobalSearchResults();
            } else {
                loadPageData();
            }
        }

        function handleSearch() {
            const val = document.getElementById('searchInput').value.trim();
            searchKeyword = val.toLowerCase();
            currentPage = 1;

            if (searchKeyword) {
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                document.getElementById('sectionTitle').innerText = `🔍 全站搜索: "${val}"`;
                loadGlobalSearchResults();
            } else {
                const firstNav = document.querySelector('.nav-item');
                if (firstNav) firstNav.click();
            }
        }

        initSite();
    </script>
    <script data-cfasync='false' src='//wwr.giriudog.com/?tag=368ba602'></script>
</body>
</html>
