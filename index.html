<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault - Video Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #121212; color: #e0e0e0; font-family: Arial, sans-serif; }
        header { background: #1f1f1f; padding: 12px 15px; text-align: center; border-bottom: 1px solid #333; }
        header h1 { color: #ff4757; font-size: 20px; letter-spacing: 1px; }
        .container { max-width: 1200px; margin: 10px auto; padding: 0 8px; }
        
        /* 🎯 手机端核心方案：固定3行 + 横向丝滑滚动，不截断任何文字，也不占垂直空间 */
        .nav-wrapper {
            background: #181818;
            padding: 8px;
            border: 1px solid #2c2c2c;
            border-radius: 6px;
            margin-bottom: 14px;
            position: relative;
        }
        .nav-grid {
            display: grid;
            grid-template-rows: repeat(3, 1fr); /* 严格固定 3 行 */
            grid-auto-flow: column;             /* 按列自动横向排列 */
            grid-auto-columns: max-content;     /* 宽度随文字自适应，绝不截断 */
            gap: 6px;
            overflow-x: auto;                   /* 允许手指左右滑动 */
            -webkit-overflow-scrolling: touch;  /* iOS/Android 惯性顺滑滚动 */
            scrollbar-width: none;              /* Firefox 隐藏滚动条 */
        }
        .nav-grid::-webkit-scrollbar {
            display: none;                      /* Chrome/Safari 隐藏滚动条更美观 */
        }

        .nav-item {
            background: #242424;
            padding: 6px 12px;
            text-align: center;
            color: #d0d0d0;
            text-decoration: none;
            font-size: 12px;
            line-height: 1.2;
            border-radius: 4px;
            transition: all 0.15s ease;
            border: 1px solid #303030;
            white-space: nowrap;
        }
        .nav-item:hover, .nav-item.active {
            background: #ff4757;
            color: #fff;
            border-color: #ff6b81;
            font-weight: bold;
        }

        .section-title {
            margin-bottom: 10px;
            font-size: 15px;
            border-left: 3px solid #ff4757;
            padding-left: 8px;
            color: #fff;
        }
        
        /* 视频列表网格 */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: 8px;
        }
        .video-card {
            background: #1e1e1e;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #2d2d2d;
            transition: transform 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .video-card:hover {
            transform: translateY(-2px);
            border-color: #555;
        }
        .video-thumb {
            width: 100%;
            height: 105px;
            background: #2a2a2a;
            object-fit: cover;
        }
        .video-info {
            padding: 7px;
        }
        .video-title {
            font-size: 12px;
            color: #fff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .video-meta {
            font-size: 11px;
            color: #888;
            display: flex;
            justify-content: space-between;
        }

        /* 电脑端宽屏适配：自动切换为 11 列完整平铺 */
        @media (min-width: 900px) {
            .container { margin: 14px auto; padding: 0 15px; }
            .nav-grid {
                grid-template-rows: none;
                grid-auto-flow: row;
                grid-template-columns: repeat(11, 1fr);
                overflow-x: visible;
                gap: 6px;
            }
            .nav-item {
                padding: 7px 4px;
                font-size: 11px;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
                gap: 14px;
            }
            .video-thumb {
                height: 135px;
            }
            .video-title {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>STREAMVAULT</h1>
    </header>

    <div class="container">
        <!-- 手机端：3行横向顺滑滑动 | 电脑端：11列3行平铺 -->
        <div class="nav-wrapper">
            <nav class="nav-grid" id="navGrid"></nav>
        </div>

        <!-- 视频列表区块 -->
        <section>
            <div class="section-title" id="sectionTitle">🔥 Latest Releases</div>
            <div class="video-grid" id="videoGrid"></div>
        </section>
    </div>

    <script>
        const categories = [
            "Featured", "Cam Girls", "JP Censored", "JP Uncensored",
            "CN Subtitles", "Busty Petite", "Sexy Wives", "Taboo / Incest",
            "Western", "Cat III", "Anime", "Stockings OL",
            "Amateur", "JP Studios", "Plot", "Leaked",
            "LGBT", "Escort", "CN Wives", "CN BDSM",
            "CN Stockings", "Madou", "CN Taboo", "Deepfake",
            "Dominance", "Humiliation", "Orgy", "Roleplay",
            "HK & TW", "Hardcore", "Trans / Femboy", "VR"
        ];

        function renderNav() {
            const navGrid = document.getElementById('navGrid');
            let html = `<a href="#" class="nav-item active" onclick="loadVideos('cat_latest.json', '🔥 Latest Releases', this)">🔥 Latest</a>`;
            html += categories.map(cat => 
                `<a href="#" class="nav-item" onclick="filterCategory('${cat}', this)" title="${cat}">${cat}</a>`
            ).join('');
            navGrid.innerHTML = html;
        }

        async function loadVideos(jsonFile, title, element) {
            if (element) {
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                element.classList.add('active');
            }
            document.getElementById('sectionTitle').innerText = title;
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '<div style="color:#888; grid-column: 1/-1; text-align:center; padding: 30px;">Loading...</div>';

            try {
                const res = await fetch(`data/${jsonFile}`);
                const videos = await res.json();
                
                if (videos.length === 0) {
                    grid.innerHTML = '<div style="color:#888; grid-column: 1/-1; text-align:center; padding: 30px;">No videos found.</div>';
                    return;
                }

                grid.innerHTML = videos.map(v => `
                    <a href="play.html?id=${v.id}" class="video-card">
                        <img src="${v.pic || 'https://via.placeholder.com/300x180?text=No+Image'}" class="video-thumb" alt="thumbnail" loading="lazy">
                        <div class="video-info">
                            <div class="video-title">${v.title}</div>
                            <div class="video-meta">
                                <span>${v.year || '2026'}</span>
                                <span>HD</span>
                            </div>
                        </div>
                    </a>
                `).join('');
            } catch (e) {
                console.error("Failed to load videos:", e);
                grid.innerHTML = '<div style="color:#888; grid-column: 1/-1; text-align:center; padding: 30px;">Please ensure data files are generated.</div>';
            }
        }

        async function filterCategory(catName, element) {
            event.preventDefault();
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');
            
            document.getElementById('sectionTitle').innerText = catName;
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '<div style="color:#888; grid-column: 1/-1; text-align:center; padding: 30px;">Loading category...</div>';

            try {
                const res = await fetch('data/categories.json');
                const catIndex = await res.json();
                const matched = catIndex.find(c => c.name === catName);

                if (!matched) {
                    grid.innerHTML = '<div style="color:#888; grid-column: 1/-1; text-align:center; padding: 30px;">Category data not found.</div>';
                    return;
                }

                let allVideos = [];
                if (matched.file) {
                    const r = await fetch(`data/${matched.file}`);
                    allVideos = await r.json();
                } else if (matched.files) {
                    for (let fname of matched.files) {
                        const r = await fetch(`data/${fname}`);
                        const chunk = await r.json();
                        allVideos = allVideos.concat(chunk);
                    }
                }

                grid.innerHTML = allVideos.map(v => `
                    <a href="play.html?id=${v.id}" class="video-card">
                        <img src="${v.pic || 'https://via.placeholder.com/300x180?text=No+Image'}" class="video-thumb" alt="thumbnail" loading="lazy">
                        <div class="video-info">
                            <div class="video-title">${v.title}</div>
                            <div class="video-meta">
                                <span>${v.year || '2026'}</span>
                                <span>HD</span>
                            </div>
                        </div>
                    </a>
                `).join('');
            } catch (e) {
                console.error("Error loading category:", e);
                grid.innerHTML = '<div style="color:#888; grid-column: 1/-1; text-align:center; padding: 30px;">Failed to load category content.</div>';
            }
        }

        renderNav();
        loadVideos('cat_latest.json', '🔥 Latest Releases');
    </script>
</body>
</html>
