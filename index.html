<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault - 精选影视中心</title>
    <style>
        :root {
            --bg-main: #0f1014;
            --bg-card: #181a20;
            --bg-nav: #14151a;
            --accent: #ff3b5c;
            --accent-hover: #ff5270;
            --text-primary: #f5f5f7;
            --text-muted: #8e929f;
            --border-color: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-main); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        /* 现代吸顶玻璃态头部 */
        .site-header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(20, 21, 26, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
        }
        .header-inner {
            max-width: 1240px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
        }
        .brand {
            display: flex; align-items: center; gap: 8px;
            text-decoration: none; color: #fff; font-size: 19px; font-weight: 800; letter-spacing: 0.5px;
        }
        .brand-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--accent); box-shadow: 0 0 10px var(--accent);
        }
        .search-box {
            display: flex; align-items: center; background: #22252e;
            border: 1px solid var(--border-color); border-radius: 20px;
            padding: 5px 12px; width: 180px; transition: width 0.25s, border-color 0.2s;
        }
        .search-box:focus-within { width: 240px; border-color: var(--accent); }
        .search-box input {
            background: transparent; border: none; outline: none;
            color: #fff; font-size: 12px; width: 100%;
        }

        .container { max-width: 1240px; margin: 14px auto; padding: 0 12px; }

        /* 全新整齐网格分类导航 */
        .nav-panel {
            background: var(--bg-nav); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 10px; margin-bottom: 18px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
            gap: 6px;
        }
        .nav-item {
            display: flex; align-items: center; justify-content: center;
            background: #1e2028; color: #c8ccd6;
            text-decoration: none; font-size: 12px; font-weight: 500;
            padding: 7px 6px; border-radius: 6px;
            border: 1px solid transparent;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: all 0.18s ease;
        }
        .nav-item:hover {
            background: #282b36; color: #fff; border-color: rgba(255,255,255,0.15);
        }
        .nav-item.active {
            background: linear-gradient(135deg, #ff3b5c, #e02444);
            color: #fff; font-weight: 600;
            box-shadow: 0 2px 10px rgba(255, 59, 92, 0.35);
        }

        /* 栏目标题 */
        .section-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color);
        }
        .section-title {
            font-size: 16px; font-weight: 700; color: #fff;
            display: flex; align-items: center; gap: 8px;
        }
        .section-title::before {
            content: ""; display: inline-block; width: 4px; height: 16px;
            background: var(--accent); border-radius: 2px;
        }
        .count-badge { font-size: 12px; color: var(--text-muted); }

        /* 视频卡片网格 */
        .video-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 10px;
        }
        .video-card {
            background: var(--bg-card); border-radius: 8px; overflow: hidden;
            border: 1px solid var(--border-color); text-decoration: none; color: inherit;
            display: flex; flex-direction: column; transition: transform 0.2s, border-color 0.2s;
        }
        .video-card:hover { transform: translateY(-3px); border-color: rgba(255, 59, 92, 0.5); }
        .thumb-wrap { position: relative; width: 100%; padding-top: 62%; background: #22252e; overflow: hidden; }
        .video-thumb { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .badge-hd {
            position: absolute; top: 6px; right: 6px;
            background: rgba(0, 0, 0, 0.72); color: #fff;
            font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px;
        }
        .video-info { padding: 8px 10px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .video-title {
            font-size: 13px; font-weight: 500; color: #eee; margin-bottom: 6px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .video-meta { font-size: 11px; color: var(--text-muted); display: flex; justify-content: space-between; }

        /* 分页栏 */
        .pagination {
            display: flex; justify-content: center; align-items: center; gap: 12px; margin: 26px 0 36px;
        }
        .page-btn {
            background: #1e2028; color: #e0e0e0; border: 1px solid var(--border-color);
            padding: 7px 16px; font-size: 12px; font-weight: 600; border-radius: 6px;
            cursor: pointer; transition: 0.18s;
        }
        .page-btn:hover:not(:disabled) { background: var(--accent); color: #fff; border-color: var(--accent); }
        .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .page-info { font-size: 12px; color: var(--text-muted); }

        @media (min-width: 768px) {
            .nav-grid { grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 8px; }
            .nav-item { font-size: 13px; padding: 8px 10px; }
            .video-grid { grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 16px; }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="brand">
                <span class="brand-dot"></span>
                <span>STREAMVAULT</span>
            </a>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索当前分类影片..." oninput="filterVideos()">
            </div>
        </div>
    </header>

    <div class="container">
        <!-- 整齐自适应网格导航 -->
        <div class="nav-panel">
            <nav class="nav-grid" id="navGrid"></nav>
        </div>

        <section>
            <div class="section-header">
                <div class="section-title" id="sectionTitle">🔥 最新发布</div>
                <div class="count-badge" id="totalBadge"></div>
            </div>
            
            <div class="video-grid" id="videoGrid"></div>
            
            <div class="pagination" id="paginationBar" style="display: none;">
                <button class="page-btn" id="prevBtn" onclick="changePage(-1)">上一页</button>
                <span class="page-info" id="pageInfo">第 1 / 1 页</span>
                <button class="page-btn" id="nextBtn" onclick="changePage(1)">下一页</button>
            </div>
        </section>
    </div>

    <script>
        let rawVideos = [];
        let filteredVideos = [];
        let currentPage = 1;
        const pageSize = 24;

        async function initSite() {
            const navGrid = document.getElementById('navGrid');
            const urlParams = new URLSearchParams(window.location.search);
            const targetCat = urlParams.get('cat');

            try {
                const res = await fetch('data/categories.json');
                const catIndex = await res.json();

                // 过滤掉 Uncategorized 以及数量为 0 的空分类
                const validCats = catIndex.filter(c => 
                    c.name !== '🔥 Latest Releases' && 
                    c.name !== 'Uncategorized' && 
                    Number(c.count) > 0
                );

                let html = `<a href="index.html" class="nav-item ${!targetCat ? 'active' : ''}" data-cat="latest" onclick="switchCategory('cat_latest.json', '🔥 最新发布', this); return false;">🔥 最新发布</a>`;
                
                html += validCats.map(c => {
                    const fileRef = c.file || (c.files ? c.files.join(',') : '');
                    const isActive = targetCat === c.name ? 'active' : '';
                    return `<a href="index.html?cat=${encodeURIComponent(c.name)}" class="nav-item ${isActive}" data-cat="${c.name}" onclick="switchCategory('${fileRef}', '${c.name}', this); return false;" title="${c.name} (${c.count})">${c.name}</a>`;
                }).join('');

                navGrid.innerHTML = html;

                // 根据 URL 参数决定默认加载哪个分类
                if (targetCat) {
                    const matched = validCats.find(c => c.name === targetCat);
                    if (matched) {
                        const fileRef = matched.file || (matched.files ? matched.files.join(',') : '');
                        await loadCategoryData(fileRef, matched.name);
                        return;
                    }
                }
                await loadCategoryData('cat_latest.json', '🔥 最新发布');
            } catch (e) {
                console.error("初始化失败", e);
                navGrid.innerHTML = '<div style="color:#888;font-size:12px;padding:8px;">暂无分类数据，请先运行采集脚本生成 data/ 目录。</div>';
            }
        }

        function switchCategory(fileRef, title, element) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');
            
            // 同步更新浏览器地址栏参数，保持多页面体验
            const newUrl = title === '🔥 最新发布' ? 'index.html' : `index.html?cat=${encodeURIComponent(title)}`;
            window.history.pushState({}, '', newUrl);
            
            document.getElementById('searchInput').value = '';
            loadCategoryData(fileRef, title);
        }

        async function loadCategoryData(fileRef, title) {
            document.getElementById('sectionTitle').innerText = title;
            currentPage = 1;
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '<div style="color:#888; grid-column: 1/-1; text-align:center; padding: 40px;">正在加载影片...</div>';
            document.getElementById('paginationBar').style.display = 'none';

            try {
                let allVideos = [];
                if (fileRef.includes(',')) {
                    for (let f of fileRef.split(',')) {
                        const r = await fetch(`data/${f.trim()}`);
                        allVideos = allVideos.concat(await r.json());
                    }
                } else {
                    const r = await fetch(`data/${fileRef}`);
                    allVideos = await r.json();
                }

                rawVideos = allVideos;
                filteredVideos = allVideos;
                renderPage();
            } catch (e) {
                grid.innerHTML = '<div style="color:#888; grid-column: 1/-1; text-align:center; padding: 40px;">数据加载失败，请检查 data/ 目录文件。</div>';
            }
        }

        function filterVideos() {
            const kw = document.getElementById('searchInput').value.trim().toLowerCase();
            filteredVideos = kw ? rawVideos.filter(v => v.title.toLowerCase().includes(kw)) : rawVideos;
            currentPage = 1;
            renderPage();
        }

        function renderPage() {
            const grid = document.getElementById('videoGrid');
            const paginationBar = document.getElementById('paginationBar');
            document.getElementById('totalBadge').innerText = `共 ${filteredVideos.length} 部`;

            if (filteredVideos.length === 0) {
                grid.innerHTML = '<div style="color:#888; grid-column: 1/-1; text-align:center; padding: 40px;">当前没有找到相关影片。</div>';
                paginationBar.style.display = 'none';
                return;
            }

            const totalPages = Math.ceil(filteredVideos.length / pageSize);
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const start = (currentPage - 1) * pageSize;
            const pageItems = filteredVideos.slice(start, start + pageSize);

            grid.innerHTML = pageItems.map(v => `
                <a href="play.html?id=${v.id}" class="video-card">
                    <div class="thumb-wrap">
                        <img src="${v.pic || 'https://via.placeholder.com/300x180?text=No+Image'}" class="video-thumb" alt="${v.title}" loading="lazy">
                        <span class="badge-hd">HD</span>
                    </div>
                    <div class="video-info">
                        <div class="video-title" title="${v.title}">${v.title}</div>
                        <div class="video-meta">
                            <span>${v.category || '精选'}</span>
                            <span>${v.year || '2026'}</span>
                        </div>
                    </div>
                </a>
            `).join('');

            if (totalPages > 1) {
                paginationBar.style.display = 'flex';
                document.getElementById('pageInfo').innerText = `第 ${currentPage} / ${totalPages} 页`;
                document.getElementById('prevBtn').disabled = (currentPage === 1);
                document.getElementById('nextBtn').disabled = (currentPage === totalPages);
            } else {
                paginationBar.style.display = 'none';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function changePage(step) {
            currentPage += step;
            renderPage();
        }

        initSite();
    </script>
</body>
</html>
