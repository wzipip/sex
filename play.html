<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault - Player</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #121212; color: #e0e0e0; font-family: Arial, sans-serif; }
        header { background: #1f1f1f; padding: 12px 15px; display: flex; align-items: center; border-bottom: 1px solid #333; }
        .back-btn { color: #ff4757; text-decoration: none; font-size: 14px; margin-right: 15px; white-space: nowrap; }
        header h1 { color: #fff; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .container { max-width: 1000px; margin: 15px auto; padding: 0 10px; }
        
        /* 播放页嵌入的紧凑分类导航栏 */
        .nav-wrapper { background: #181818; padding: 6px; border: 1px solid #2c2c2c; border-radius: 6px; margin-bottom: 12px; }
        .nav-grid {
            display: grid;
            grid-template-rows: repeat(2, 1fr);
            grid-auto-flow: column;
            grid-auto-columns: max-content;
            gap: 5px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .nav-grid::-webkit-scrollbar { display: none; }
        .nav-item {
            background: #242424; padding: 4px 10px; text-align: center; color: #d0d0d0;
            text-decoration: none; font-size: 11px; border-radius: 3px; border: 1px solid #303030; white-space: nowrap;
        }
        .nav-item:hover { background: #ff4757; color: #fff; border-color: #ff6b81; }

        .player-container {
            position: relative; width: 100%; padding-top: 56.25%; background: #000;
            border-radius: 6px; overflow: hidden; border: 1px solid #333;
        }
        .player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        .episodes-section { margin-top: 15px; background: #1a1a1a; padding: 12px; border-radius: 6px; border: 1px solid #333; }
        .episodes-title { font-size: 13px; color: #aaa; margin-bottom: 8px; font-weight: bold; }
        .episodes-grid { display: flex; flex-wrap: wrap; gap: 6px; max-height: 140px; overflow-y: auto; }
        .ep-btn { background: #222; color: #ccc; border: 1px solid #333; padding: 6px 10px; font-size: 12px; border-radius: 4px; cursor: pointer; text-decoration: none; }
        .ep-btn:hover, .ep-btn.active { background: #ff4757; color: #fff; border-color: #ff6b81; }

        .video-details { margin-top: 15px; background: #1a1a1a; padding: 15px; border-radius: 6px; border: 1px solid #333; }
        .video-details h2 { font-size: 18px; color: #fff; margin-bottom: 8px; }
        .video-details p { color: #aaa; font-size: 13px; line-height: 1.4; margin-top: 6px; }
        .meta-info { font-size: 11px; color: #888; margin-bottom: 8px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">&#8592; Back</a>
        <h1 id="pageTitle">StreamVault Player</h1>
    </header>

    <div class="container">
        <!-- 播放页同步展示分类导航栏，支持直接跳转回首页对应分类 -->
        <div class="nav-wrapper">
            <nav class="nav-grid" id="navGrid"></nav>
        </div>

        <div class="player-container">
            <iframe id="playerFrame" allowfullscreen></iframe>
        </div>

        <div class="episodes-section" id="episodesSection" style="display: none;">
            <div class="episodes-title">Episodes / Sources:</div>
            <div class="episodes-grid" id="episodesGrid"></div>
        </div>

        <div class="video-details">
            <h2 id="videoTitle">Loading title...</h2>
            <div class="meta-info" id="videoMeta"></div>
            <p id="videoDesc"></p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id');
        const PLAYER_PREFIX = "https://yutujx.com/?url=";[span_0](start_span)[span_0](end_span)

        // 过滤 HTML 标签（如 <p>, </p>, <br>）
        function cleanHtmlTags(str) {
            if (!str) return "No description available.";
            return str.replace(/<[^>]+>/g, '').trim();
        }

        async function initPlayerNav() {
            const navGrid = document.getElementById('navGrid');
            try {
                const res = await fetch('data/categories.json');
                const catIndex = await res.json();
                navGrid.innerHTML = catIndex.map(c => 
                    `<a href="index.html" class="nav-item">${c.name}</a>`
                ).join('');
            } catch (e) {
                console.error(e);
            }
        }

        async function loadVideoDetail() {
            if (!videoId) {
                document.getElementById('videoTitle').innerText = "Error: No video ID provided.";
                return;
            }

            try {
                const lookupRes = await fetch('data/vod_lookup.json');
                const vodLookup = await lookupRes.json();
                const dataFile = vodLookup[videoId];

                if (!dataFile) {
                    document.getElementById('videoTitle').innerText = "Video not found in local cache.";
                    return;
                }

                const chunkRes = await fetch(`data/${dataFile}`);
                const chunkData = await chunkRes.json();
                const video = chunkData.find(v => String(v.id) === String(videoId));

                if (!video) {
                    document.getElementById('videoTitle').innerText = "Video details not found.";
                    return;
                }

                document.getElementById('videoTitle').innerText = video.title;
                document.getElementById('pageTitle').innerText = video.title;
                document.getElementById('videoMeta').innerText = `Category: ${video.category} | Year: ${video.year || 'N/A'} | Area: ${video.area || 'N/A'}`;
                
                const cleanDesc = cleanHtmlTags(video.content);
                document.getElementById('videoDesc').innerText = cleanDesc ? `Description: ${cleanDesc}` : "No description available.";

                const episodes = video.episodes || [];
                if (episodes.length > 0) {
                    const epSection = document.getElementById('episodesSection');
                    const epGrid = document.getElementById('episodesGrid');
                    epSection.style.display = 'block';

                    epGrid.innerHTML = episodes.map((ep, idx) => `
                        <button class="ep-btn ${idx === 0 ? 'active' : ''}" onclick="playEpisode('${ep.url}', this)">
                            ${ep.name || `Episode ${idx + 1}`}
                        </button>
                    `).join('');

                    playEpisode(episodes[0].url);
                } else {
                    document.getElementById('playerFrame').srcdoc = '<div style="color:#fff;display:flex;align-items:center;justify-content:center;height:100%;font-family:sans-serif;">No valid playback source found.</div>';
                }

            } catch (e) {
                console.error("Failed to load video details:", e);
                document.getElementById('videoTitle').innerText = "Failed to load video data.";
            }
        }

        function playEpisode(url, buttonElement) {
            if (buttonElement) {
                document.querySelectorAll('.ep-btn').forEach(btn => btn.classList.remove('active'));
                buttonElement.classList.add('active');
            }
            document.getElementById('playerFrame').src = PLAYER_PREFIX + url;
        }

        initPlayerNav();
        loadVideoDetail();
    </script>
</body>
</html>
