<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在播放 - StreamVault</title>
    <style>
        :root {
            --bg-main: #0f1014;
            --bg-card: #181a20;
            --bg-nav: #14151a;
            --accent: #ff3b5c;
            --text-primary: #f5f5f7;
            --text-muted: #8e929f;
            --border-color: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-main); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        /* 现代吸顶头部 */
        .site-header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(20, 21, 26, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 16px;
        }
        .header-inner {
            max-width: 1240px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between;
        }
        .brand {
            display: flex; align-items: center; gap: 8px;
            text-decoration: none; color: #fff; font-size: 18px; font-weight: 800; letter-spacing: 0.5px;
        }
        .brand-dot {
            width: 9px; height: 9px; border-radius: 50%;
            background: var(--accent); box-shadow: 0 0 8px var(--accent);
        }
        .back-home {
            color: #d0d4de; text-decoration: none; font-size: 12px; font-weight: 600;
            background: #22252e; padding: 5px 12px; border-radius: 6px;
            border: 1px solid var(--border-color); transition: 0.15s;
        }
        .back-home:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

        .container { max-width: 1100px; margin: 12px auto; padding: 0 10px; }

        /* 紧凑整齐的分类导航 */
        .nav-panel {
            background: var(--bg-nav); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 8px; margin-bottom: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
            gap: 4px;
            align-content: start;
        }
        .nav-item {
            display: flex; align-items: center; justify-content: center;
            background: #1e2028; color: #c8ccd6;
            text-decoration: none; font-size: 11px; font-weight: 500;
            padding: 6px 4px; border-radius: 4px;
            border: 1px solid transparent;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: all 0.15s ease;
        }
        .nav-item:hover {
            background: #282b36; color: #fff; border-color: rgba(255,255,255,0.12);
        }

        /* 播放器容器 */
        .player-box {
            position: relative; width: 100%; padding-top: 56.25%;
            background: #000; border-radius: 8px; overflow: hidden;
            border: 1px solid var(--border-color); box-shadow: 0 6px 24px rgba(0,0,0,0.4);
        }
        .player-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* 选集面板 */
        .episodes-card {
            margin-top: 14px; background: var(--bg-card); padding: 12px;
            border-radius: 8px; border: 1px solid var(--border-color);
        }
        .card-label { font-size: 12px; font-weight: 700; color: #fff; margin-bottom: 8px; }
        .episodes-grid { display: flex; flex-wrap: wrap; gap: 6px; max-height: 150px; overflow-y: auto; }
        .ep-btn {
            background: #22252e; color: #ccc; border: 1px solid var(--border-color);
            padding: 5px 10px; font-size: 11px; border-radius: 4px; cursor: pointer; transition: 0.15s;
        }
        .ep-btn:hover, .ep-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }

        /* 影片详情卡片 */
        .detail-card {
            margin-top: 14px; margin-bottom: 24px; background: var(--bg-card);
            padding: 14px; border-radius: 8px; border: 1px solid var(--border-color);
        }
        .detail-card h1 { font-size: 16px; color: #fff; margin-bottom: 6px; }
        .meta-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
        .tag {
            background: #22252e; color: var(--text-muted); font-size: 10px;
            padding: 2px 6px; border-radius: 3px;
        }
        .desc-text { color: #b0b4c0; font-size: 12px; line-height: 1.5; }

        @media (min-width: 768px) {
            .nav-grid { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
            .nav-item { font-size: 12px; padding: 7px 6px; }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="brand">
                <span class="brand-dot"></span>
                <span>STREAMVAULT</span>
            </a>
            <a href="index.html" class="back-home">返回首页</a>
        </div>
    </header>

    <div class="container">
        <!-- 导航面板 -->
        <div class="nav-panel">
            <nav class="nav-grid" id="navGrid"></nav>
        </div>

        <div class="player-box">
            <iframe id="playerFrame" allowfullscreen></iframe>
        </div>

        <div class="episodes-card" id="episodesSection" style="display: none;">
            <div class="card-label">播放选集</div>
            <div class="episodes-grid" id="episodesGrid"></div>
        </div>

        <div class="detail-card">
            <h1 id="videoTitle">正在加载影片...</h1>
            <div class="meta-tags" id="videoMeta"></div>
            <p class="desc-text" id="videoDesc"></p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id');
        const PLAYER_PREFIX = "https://yutujx.com/?url=";

        async function initPlayer() {
            try {
                const res = await fetch('data/categories.json');
                const catIndex = await res.json();
                const validCats = catIndex.filter(c => 
                    c.name !== '🔥 Latest Releases' && 
                    c.name !== 'Uncategorized' && 
                    Number(c.count) > 0
                );

                let html = `<a href="index.html" class="nav-item">🔥 最新发布</a>`;
                html += validCats.map(c => 
                    `<a href="index.html?cat=${encodeURIComponent(c.name)}" class="nav-item" title="${c.name}">${c.name}</a>`
                ).join('');
                document.getElementById('navGrid').innerHTML = html;
            } catch (e) {
                console.error("加载导航失败", e);
            }

            if (!videoId) {
                document.getElementById('videoTitle').innerText = "错误：未指定影片 ID";
                return;
            }

            let video = null;
            try {
                const lookupRes = await fetch('data/vod_lookup.json');
                const vodLookup = await lookupRes.json();
                const dataFile = vodLookup[videoId];

                if (dataFile) {
                    const chunkRes = await fetch(`data/${dataFile}`);
                    const chunkData = await chunkRes.json();
                    video = chunkData.find(v => String(v.id) === String(videoId));
                }

                if (!video) {
                    const catRes = await fetch('data/categories.json');
                    const catIndex = await catRes.json();
                    for (let cat of catIndex) {
                        let files = cat.files || (cat.file ? [cat.file] : []);
                        for (let f of files) {
                            try {
                                const r = await fetch(`data/${f}`);
                                const chunk = await r.json();
                                video = chunk.find(v => String(v.id) === String(videoId));
                                if (video) break;
                            } catch (err) {}
                        }
                        if (video) break;
                    }
                }

                if (!video) {
                    document.getElementById('videoTitle').innerText = "未找到该影片详情，请确认数据已采集完整。";
                    return;
                }

                document.getElementById('videoTitle').innerText = video.title;
                document.title = `${video.title} - StreamVault`;
                document.getElementById('videoMeta').innerHTML = `
                    <span class="tag">分类：${video.category || '精选'}</span>
                    <span class="tag">年份：${video.year || '2026'}</span>
                    <span class="tag">地区：${video.area || '未知'}</span>
                `;
                document.getElementById('videoDesc').innerText = cleanHtmlTags(video.content);

                const episodes = video.episodes || [];
                if (episodes.length > 0) {
                    const epSection = document.getElementById('episodesSection');
                    const epGrid = document.getElementById('episodesGrid');
                    epSection.style.display = 'block';

                    epGrid.innerHTML = episodes.map((ep, idx) => `
                        <button class="ep-btn ${idx === 0 ? 'active' : ''}" onclick="playEpisode('${ep.url}', this)">
                            ${ep.name || `第 ${idx + 1} 集`}
                        </button>
                    `).join('');

                    playEpisode(episodes[0].url);
                } else {
                    document.getElementById('playerFrame').srcdoc = '<div style="color:#888;display:flex;align-items:center;justify-content:center;height:100%;font-family:sans-serif;font-size:13px;">暂无有效播放源</div>';
                }

            } catch (e) {
                console.error("加载播放页失败:", e);
                document.getElementById('videoTitle').innerText = "加载影片数据时发生错误。";
            }
        }

        function cleanHtmlTags(str) {
            if (!str) return "暂无简介";
            return str.replace(/<[^>]+>/g, '').trim() || "暂无简介";
        }

        function playEpisode(url, buttonElement) {
            if (buttonElement) {
                document.querySelectorAll('.ep-btn').forEach(btn => btn.classList.remove('active'));
                buttonElement.classList.add('active');
            }
            document.getElementById('playerFrame').src = PLAYER_PREFIX + url;
        }

        initPlayer();
    </script>
</body>
</html>
