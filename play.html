<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在播放 - StreamVault</title>
    <style>
        :root {
            --bg-main: #0f1014;
            --bg-card: #181a20;
            --bg-nav: #14151a;
            --accent: #ff3b5c;
            --text-primary: #f5f5f7;
            --text-muted: #8e929f;
            --border-color: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-main); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        /* 与首页完全统一的吸顶头部 */
        .site-header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(20, 21, 26, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
        }
        .header-inner {
            max-width: 1240px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between;
        }
        .brand {
            display: flex; align-items: center; gap: 8px;
            text-decoration: none; color: #fff; font-size: 19px; font-weight: 800; letter-spacing: 0.5px;
        }
        .brand-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--accent); box-shadow: 0 0 10px var(--accent);
        }
        .back-home {
            color: #d0d4de; text-decoration: none; font-size: 12px; font-weight: 600;
            background: #22252e; padding: 6px 12px; border-radius: 6px;
            border: 1px solid var(--border-color); transition: 0.18s;
        }
        .back-home:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

        .container { max-width: 1100px; margin: 14px auto; padding: 0 12px; }

        /* 与首页完全一致的整齐网格导航 */
        .nav-panel {
            background: var(--bg-nav); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 10px; margin-bottom: 16px;
        }
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
            gap: 6px;
        }
        .nav-item {
            display: flex; align-items: center; justify-content: center;
            background: #1e2028; color: #c8ccd6;
            text-decoration: none; font-size: 12px; font-weight: 500;
            padding: 7px 6px; border-radius: 6px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: all 0.18s ease;
        }
        .nav-item:hover { background: var(--accent); color: #fff; font-weight: 600; }

        /* 播放器容器 */
        .player-box {
            position: relative; width: 100%; padding-top: 56.25%;
            background: #000; border-radius: 10px; overflow: hidden;
            border: 1px solid var(--border-color); box-shadow: 0 8px 30px rgba(0,0,0,0.45);
        }
        .player-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* 选集面板 */
        .episodes-card {
            margin-top: 16px; background: var(--bg-card); padding: 14px;
            border-radius: 10px; border: 1px solid var(--border-color);
        }
        .card-label { font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 10px; }
        .episodes-grid { display: flex; flex-wrap: wrap; gap: 8px; max-height: 160px; overflow-y: auto; }
        .ep-btn {
            background: #22252e; color: #ccc; border: 1px solid var(--border-color);
            padding: 6px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; transition: 0.15s;
        }
        .ep-btn:hover, .ep-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }

        /* 影片详情卡片 */
        .detail-card {
            margin-top: 16px; margin-bottom: 30px; background: var(--bg-card);
            padding: 16px; border-radius: 10px; border: 1px solid var(--border-color);
        }
        .detail-card h1 { font-size: 18px; color: #fff; margin-bottom: 8px; }
        .meta-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .tag {
            background: #22252e; color: var(--text-muted); font-size: 11px;
            padding: 3px 8px; border-radius: 4px;
        }
        .desc-text { color: #b0b4c0; font-size: 13px; line-height: 1.6; }

        @media (min-width: 768px) {
            .nav-grid { grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 8px; }
            .nav-item { font-size: 13px; padding: 8px 10px; }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="brand">
                <span class="brand-dot"></span>
                <span>STREAMVAULT</span>
            </a>
            <a href="index.html" class="back-home">返回首页</a>
        </div>
    </header>

    <div class="container">
        <!-- 播放页同步导航：点击任意分类直接跳转到首页对应分类 -->
        <div class="nav-panel">
            <nav class="nav-grid" id="navGrid"></nav>
        </div>

        <div class="player-box">
            <iframe id="playerFrame" allowfullscreen></iframe>
        </div>

        <div class="episodes-card" id="episodesSection" style="display: none;">
            <div class="card-label">播放选集</div>
            <div class="episodes-grid" id="episodesGrid"></div>
        </div>

        <div class="detail-card">
            <h1 id="videoTitle">正在加载影片信息...</h1>
            <div class="meta-tags" id="videoMeta"></div>
            <p class="desc-text" id="videoDesc"></p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id');
        const PLAYER_PREFIX = "https://yutujx.com/?url=";

        async function initPlayerNav() {
            const navGrid = document.getElementById('navGrid');
            try {
                const res = await fetch('data/categories.json');
                const catIndex = await res.json();
                
                const validCats = catIndex.filter(c => 
                    c.name !== '🔥 Latest Releases' && 
                    c.name !== 'Uncategorized' && 
                    Number(c.count) > 0
                );

                let html = `<a href="index.html" class="nav-item">🔥 最新发布</a>`;
                html += validCats.map(c => 
                    `<a href="index.html?cat=${encodeURIComponent(c.name)}" class="nav-item" title="${c.name}">${c.name}</a>`
                ).join('');
                navGrid.innerHTML = html;
            } catch (e) {
                console.error("加载导航失败", e);
            }
        }

        function cleanHtmlTags(str) {
            if (!str) return "暂无简介";
            return str.replace(/<[^>]+>/g, '').trim() || "暂无简介";
        }

        async function loadVideoDetail() {
            if (!videoId) {
                document.getElementById('videoTitle').innerText = "错误：未指定影片 ID";
                return;
            }

            try {
                const lookupRes = await fetch('data/vod_lookup.json');
                const vodLookup = await lookupRes.json();
                const dataFile = vodLookup[videoId];

                if (!dataFile) {
                    document.getElementById('videoTitle').innerText = "未找到该影片数据，请确认采集已完成。";
                    return;
                }

                const chunkRes = await fetch(`data/${dataFile}`);
                const chunkData = await chunkRes.json();
                const video = chunkData.find(v => String(v.id) === String(videoId));

                if (!video) {
                    document.getElementById('videoTitle').innerText = "影片详情加载失败。";
                    return;
                }

                document.getElementById('videoTitle').innerText = video.title;
                document.title = `${video.title} - StreamVault`;
                document.getElementById('videoMeta').innerHTML = `
                    <span class="tag">分类：${video.category}</span>
                    <span class="tag">年份：${video.year || '2026'}</span>
                    <span class="tag">地区：${video.area || '未知'}</span>
                `;
                document.getElementById('videoDesc').innerText = cleanHtmlTags(video.content);

                const episodes = video.episodes || [];
                if (episodes.length > 0) {
                    const epSection = document.getElementById('episodesSection');
                    const epGrid = document.getElementById('episodesGrid');
                    epSection.style.display = 'block';

                    epGrid.innerHTML = episodes.map((ep, idx) => `
                        <button class="ep-btn ${idx === 0 ? 'active' : ''}" onclick="playEpisode('${ep.url}', this)">
                            ${ep.name || `第 ${idx + 1} 集`}
                        </button>
                    `).join('');

                    playEpisode(episodes[0].url);
                } else {
                    document.getElementById('playerFrame').srcdoc = '<div style="color:#888;display:flex;align-items:center;justify-content:center;height:100%;font-family:sans-serif;font-size:14px;">暂无有效播放源</div>';
                }

            } catch (e) {
                console.error("加载播放页失败:", e);
                document.getElementById('videoTitle').innerText = "加载影片数据时发生错误。";
            }
        }

        function playEpisode(url, buttonElement) {
            if (buttonElement) {
                document.querySelectorAll('.ep-btn').forEach(btn => btn.classList.remove('active'));
                buttonElement.classList.add('active');
            }
            document.getElementById('playerFrame').src = PLAYER_PREFIX + url;
        }

        initPlayerNav();
        loadVideoDetail();
    </script>
</body>
</html>
